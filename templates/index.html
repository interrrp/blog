<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>int</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: 0;
      }

      body {
        font-family: "Times New Roman", Times, serif;
        line-height: 1;

        max-width: 50rem;
        margin: 0 auto;
        padding: 3rem 1rem;

        display: flex;
        flex-direction: column;
        gap: 3rem;
      }

      .entries {
        display: flex;
        flex-direction: column;
        gap: 3rem;
      }

      ul {
        list-style-type: none;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      h1 {
        margin-bottom: 1rem;
      }

      .post {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .post-title {
        margin: 0;
      }

      .post-preview {
        opacity: 90%;
        line-height: 1.5;
      }

      time {
        opacity: 50%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Welcome</h1>
      <p>I post dumb opinionated stuff here sometimes</p>
    </header>

    <main>
      <ul class="entries">
        $entries
      </ul>
    </main>
  </body>
</html>
